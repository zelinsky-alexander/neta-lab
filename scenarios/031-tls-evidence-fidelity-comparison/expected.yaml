scenario:
  id: NETA-LAB-031
  name: tls-evidence-fidelity-comparison
  version: 1
  category: evidence-fidelity
  platform: linux
  safety: benign
required_phases:
  exact_application_session:
    source: instrumented_openssl_application
    expected_fidelity: EXACT
  supporting_probe:
    source: independent_neta_probe
    expected_fidelity: SUPPORTING
validation:
  preserve_distinct_provenance: true
  supporting_probe_must_not_be_promoted_to_exact_application_identity: true
expected_findings: []

notes:
  - Exact application-session evidence is required in always-on service mode.
  - The independent supporting probe is exercised only by explicit target observation and is not a service-mode acceptance requirement.

acceptance_contract:
  detector:
    required: false
    forbidden_rules: TLS-001,TLS-002
  evidence:
    required: true
    target_port: 18471
    tls_fidelity: EXACT
