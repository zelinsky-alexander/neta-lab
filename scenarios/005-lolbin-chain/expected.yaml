scenario:
  id: NETA-LAB-005
  name: system-utility-staging-chain
  version: 2
  category: endpoint-chain
  platform: cross-platform
  platforms:
    - windows
    - linux
  safety: benign

activity:
  semantics: trusted_system_utility_staging_chain
  operations:
    - controlled_http_download
    - base64_encode
    - base64_decode
    - controlled_http_callback
  downloaded_content_type: text/plain
  executable_download: false
  execution_of_downloaded_content: false
  persistence: false
  credential_access: false
  privilege_transition: false

platform_activity:
  windows:
    launcher: cmd.exe
    script_process: powershell.exe
    utilities:
      - certutil.exe
    trust_context: authenticode_signer
  linux:
    launcher: bash
    script_process: bash
    utilities:
      - curl
      - base64
      - sha256sum
    trust_context: system_package_provenance

expected_evidence:
  process_lifecycle: required
  parent_child_chain: required
  command_line: required
  file_creation: required
  executable_path: required
  file_sha256: optional
  connection_lifecycle: required
  process_attribution: required
  signer_state: windows_required_for_full_pass
  signer_identity: windows_required_for_full_pass
  package_provenance: linux_required_for_full_pass_when_collector_supported
  dns: optional
  route: optional
  tcp_metrics: optional
  first_seen_artifact: optional

platform_expectations:
  windows:
    expected_finding: SIGNED_SYSTEM_UTILITY_STAGING_CHAIN
    trust_rule: valid_signer_must_not_suppress_behavior
  linux:
    expected_finding: SYSTEM_UTILITY_STAGING_CHAIN
    trust_rule: package_or_system_provenance_must_not_suppress_behavior
    provenance_ground_truth:
      - package_manager_owner_when_available
      - package_version_when_available

expected_findings:
  - type: SIGNED_SYSTEM_UTILITY_STAGING_CHAIN
    platform: windows
    minimum_severity: medium
    malicious_intent: unknown
    requires_capabilities:
      - process_lifecycle
      - parent_child_chain
      - command_line
      - file_creation
      - connection_lifecycle
      - process_attribution
  - type: SYSTEM_UTILITY_STAGING_CHAIN
    platform: linux
    minimum_severity: medium
    malicious_intent: unknown
    requires_capabilities:
      - process_lifecycle
      - parent_child_chain
      - command_line
      - file_creation
      - connection_lifecycle
      - process_attribution

validation:
  trust_is_context_not_allowlist: true
  detection_must_not_depend_on:
    - scenario_id
    - run_id
    - lab_http_headers
    - lab_server_paths
    - exact_temporary_filenames
    - exact_stage_content
    - server_ground_truth_log
  unsupported_if_missing:
    - process_lifecycle
    - parent_child_chain
    - command_line
    - file_creation
    - connection_lifecycle
    - process_attribution

notes:
  - Windows uses certutil.exe and Authenticode signer evidence.
  - Linux uses ordinary system utilities and records package-manager provenance when available; it does not invent Authenticode-style signing semantics.
  - The staged object is inert text and is never executed.
  - Trusted publisher or package provenance is contextual evidence, not a behavioral allowlist.
