scenario:
  id: NETA-LAB-003
  name: controlled-large-download
  version: 1
  category: network
  safety: benign

activity:
  protocol: http
  transport: tcp
  direction: outbound
  connection_count: 1
  payload_bytes: 314572800
  payload_mib: 300

expected_evidence:
  connection_lifecycle: required
  process_attribution: required
  remote_endpoint: required
  cumulative_received_bytes: required_for_full_pass
  tcp_metrics: optional
  route: optional
  dns: optional
  tls: not_applicable

expected_findings:
  - type: LARGE_INGRESS_TRANSFER
    minimum_severity: low
    malicious_intent: unknown
    requires_capability: cumulative_received_bytes

validation:
  received_bytes_tolerance_percent: 1
  do_not_use_as_substitute:
    - recv_queue_bytes
    - send_queue_bytes
  unsupported_if_missing:
    - cumulative_received_bytes

notes:
  - Lab markers identify independent ground truth only and must not be used by detection rules.
  - The 300 MiB workload exceeds the production NET-001 threshold of 256 MiB with margin.

acceptance_contract:
  detector:
    required: true
    rule_id: NET-001
    semantic_type: LARGE_INGRESS_TRANSFER
    target_port: 18081
    minimum_severity: low
    allowed_statuses: ACTIVE,CANDIDATE
    evidence_root: required
    ruleset_provenance: required
  portal:
    visible_in_all: true
    visible_in_active: status_dependent
  evidence:
    required: true
    target_port: 18081
    transfer: ingress
