scenario:
  id: NETA-LAB-006
  name: suspicious-process-tree-masquerading-chain
  version: 2
  category: endpoint-process
  platform: cross-platform
  platforms:
    - windows
    - linux
  safety: benign

activity:
  semantics: renamed_system_binary_process_tree
  copied_executable_location: user_writable_temp
  network_required: false
  executable_download: false
  process_injection: false
  persistence: false
  privilege_transition: false
  credential_access: false

platform_activity:
  windows:
    launcher: cmd.exe
    orchestrator: powershell.exe
    source_executable: "%SystemRoot%\\System32\\cmd.exe"
    copied_executable_name: windows-update-helper.exe
    child_processes:
      - whoami.exe
      - hostname.exe
      - ipconfig.exe
    trust_context: authenticode_signer
  linux:
    launcher: bash
    source_executable: canonical_target_of_sh
    copied_executable_name: system-update-helper
    child_processes:
      - id
      - hostname
      - uname
    trust_context: system_package_provenance

expected_evidence:
  process_lifecycle: required
  parent_child_chain: required
  command_line: required
  file_creation: required
  executable_path: required
  executable_sha256: required
  signer_state: windows_required_for_full_pass
  signer_identity: windows_required_for_full_pass
  original_filename_identity: windows_optional
  package_provenance: linux_required_for_full_pass_when_collector_supported
  first_seen_artifact: optional
  user_logon_identity: optional
  file_metadata: optional
  connection_lifecycle: not_applicable
  dns: not_applicable
  tls_identity: not_applicable

expected_identity_relationship:
  source_and_copy_sha256_equal: true
  copied_path_is_nonstandard: true
  copied_filename_differs_from_original: true
  trusted_identity_or_provenance_does_not_suppress_contextual_finding: true

platform_expectations:
  windows:
    child_processes:
      - whoami.exe
      - hostname.exe
      - ipconfig.exe
  linux:
    child_processes:
      - id
      - hostname
      - uname
    source_package_provenance_recorded_when_available: true

expected_findings:
  - type: RENAMED_SYSTEM_BINARY_PROCESS_TREE
    minimum_severity: medium
    malicious_intent: unknown
    requires_capabilities:
      - process_lifecycle
      - parent_child_chain
      - command_line
      - file_creation
      - executable_path
      - executable_sha256

validation:
  trusted_identity_is_context_not_suppression: true
  detection_must_not_depend_on:
    - scenario_id
    - run_id
    - exact_temporary_directory
    - exact_copied_filename
    - exact_output_filenames
    - lab_console_ground_truth
  unsupported_if_missing:
    - process_lifecycle
    - parent_child_chain
    - command_line
    - file_creation
    - executable_path
    - executable_sha256

notes:
  - Windows copies the legitimate local cmd.exe without modifying it.
  - Linux resolves the system sh executable, copies that binary unchanged into a user-writable temporary path, and executes the renamed copy.
  - The suspicious signal is contextual: trusted/system provenance plus unusual path/name plus process ancestry and child-process behavior.
  - Network activity is deliberately absent so this scenario validates process-centric detection independently.

acceptance_contract:
  detector:
    required: true
    rule_id: EDR-003
    semantic_type: RENAMED_SYSTEM_BINARY_PROCESS_TREE
    minimum_severity: medium
    allowed_statuses: ACTIVE,CANDIDATE
    subject_type: PROCESS
    evidence_root: required
    ruleset_provenance: required
  portal:
    visible_in_all: true
    visible_in_active: status_dependent
  evidence:
    required: true
    process_only: true
    file_creation: required
