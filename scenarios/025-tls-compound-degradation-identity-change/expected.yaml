scenario:
  id: NETA-LAB-025
  name: tls-compound-degradation-identity-change
  version: 1
  category: tls-assurance
  platform: linux
  safety: benign
controlled_behavior:
  baseline_identity: A
  impaired_identity: B
  netem: 'delay 120ms loss 1%'
expected_assurance:
  performance: DEGRADED
  trust: CHANGED
expected_findings:
  - TLS_IDENTITY_CHANGE
validation:
  correlation_observed: true
  causality_between_transport_and_identity_change: NOT_ESTABLISHED

acceptance_contract:
  detector:
    required: true
    rule_id: TLS-002
    semantic_type: TLS_IDENTITY_CHANGE
    minimum_severity: high
    allowed_statuses: ACTIVE,CANDIDATE
    evidence_root: required
    ruleset_provenance: required
  assurance:
    performance: DEGRADED
    trust: CHANGED
  evidence:
    required: true
    target_port: 18465
    tls_fidelity: EXACT
  portal:
    visible_in_all: true
    visible_in_active: status_dependent
