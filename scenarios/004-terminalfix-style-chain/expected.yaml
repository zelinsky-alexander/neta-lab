scenario:
  id: NETA-LAB-004
  name: terminalfix-style-chain
  version: 2
  category: endpoint-chain
  platform: cross-platform
  platforms:
    - windows
    - linux
  safety: benign

activity:
  semantics: scripted_download_execute_network_chain
  protocol: https
  transport: tcp
  callback_count: 1
  persistence: false
  credential_access: false
  command_and_control: simulated_behavior_only

platform_activity:
  windows:
    launcher: cmd.exe
    script_process: powershell.exe
    downloader: curl.exe
    downloaded_artifact: neta-lab-004-payload.exe
  linux:
    launcher: bash
    script_process: bash
    downloader: curl
    downloaded_artifact: neta-lab-004-payload

expected_evidence:
  process_lifecycle: required
  parent_child_chain: required
  file_creation: required
  executable_path: required
  executable_sha256: required
  dns: platform_specific
  connection_lifecycle: required
  process_attribution: required
  tls_identity: required_for_full_pass
  user_logon_identity: optional
  signer_state: windows_optional
  package_provenance: linux_optional
  route: optional
  tcp_metrics: optional
  first_seen_artifact: optional

platform_expectations:
  windows:
    dns: required_for_full_pass_when_hostname_used
    parent_chain:
      - parent: cmd.exe
        child: powershell.exe
      - parent: powershell.exe
        child: neta-lab-004-payload.exe
  linux:
    dns: optional_when_ip_target_used
    process_roles:
      - launcher_shell
      - curl_downloader
      - downloaded_executable_script
      - callback_client
    downloaded_artifact_executes_from_user_writable_temp: true
    downloaded_artifact_sha256_required: true

expected_findings:
  - type: SCRIPTED_DOWNLOAD_EXECUTE_NETWORK_CHAIN
    minimum_severity: medium
    malicious_intent: unknown
    requires_capabilities:
      - process_lifecycle
      - parent_child_chain
      - file_creation
      - executable_sha256
      - process_attribution
      - connection_lifecycle

validation:
  detection_must_not_depend_on:
    - scenario_id
    - lab_http_headers
    - run_id
    - payload_filename
    - callback_path
    - server_ground_truth_log
  unsupported_if_missing:
    - process_lifecycle
    - parent_child_chain
    - file_creation
    - executable_sha256
    - process_attribution
    - connection_lifecycle
  full_pass_also_requires:
    - tls_identity

notes:
  - Windows keeps the original TerminalFix/ClickFix-style launcher and executable payload semantics.
  - Linux preserves the same causal meaning with a downloaded executable shell payload that performs one HTTPS callback.
  - Linux full-cycle acceptance currently targets the controlled server by private IP, so DNS evidence is not fabricated as a requirement for that run.
  - Lab markers provide independent ground truth only and must never become detector features.
  - Missing endpoint evidence remains UNKNOWN/UNAVAILABLE rather than being inferred from the lab script.

acceptance_contract:
  detector:
    required: true
    rule_id: EDR-001
    semantic_type: SCRIPTED_DOWNLOAD_EXECUTE_NETWORK_CHAIN
    minimum_severity: medium
    allowed_statuses: ACTIVE,CANDIDATE
    subject_type: PROCESS
    evidence_root: required
    ruleset_provenance: required
  portal:
    visible_in_all: true
    visible_in_active: status_dependent
  evidence:
    required: true
    target_port: 18444
    file_creation: required
