scenario:
  id: NETA-LAB-021
  name: tls-stable-identity
  version: 1
  category: tls-assurance
  platform: linux
  safety: benign
expected_evidence:
  connection_lifecycle: required
  process_attribution: required
  tls_role: required_for_full_pass
  tls_protocol: required_for_full_pass
  tls_cipher: required_for_full_pass
  sni: required_for_full_pass
