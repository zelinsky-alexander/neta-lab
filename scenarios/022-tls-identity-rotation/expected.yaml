scenario:
  id: NETA-LAB-022
  name: tls-identity-rotation
  version: 1
  category: tls-assurance
  platform: linux
  safety: benign
ground_truth:
  identity_sequence: [A, B]
expected_evidence:
  connection_lifecycle: required
  process_attribution: required
  tls_session: required_for_full_pass
  tls_identity: required_for_full_pass
  certificate_validation: required_for_full_pass
  hostname_validation: required_for_full_pass
expected_assurance:
  performance: NORMAL
  trust: CHANGED
expected_findings:
  - TLS_IDENTITY_CHANGE
forbidden_findings:
  - PERIODIC_OUTBOUND_CONNECTION
  - HIGH_OUTBOUND_ASYMMETRY

acceptance_contract:
  detector:
    required: true
    rule_id: TLS-002
    semantic_type: TLS_IDENTITY_CHANGE
    minimum_severity: high
    allowed_statuses: ACTIVE,CANDIDATE
    evidence_root: required
    ruleset_provenance: required
    forbidden_rules: BEH-001,NET-005
  assurance:
    performance: NORMAL
    trust: CHANGED
  evidence:
    required: true
    target_port: 18462
    tls_fidelity: EXACT
  portal:
    visible_in_all: true
    visible_in_active: status_dependent
